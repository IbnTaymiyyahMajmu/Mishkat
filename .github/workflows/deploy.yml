# Build the static site and publish it to GitHub Pages.
#
# Before this can run: Settings → Pages → Source: "GitHub Actions".
#
# `configure-pages` reports the URL the site will actually be served from, so a
# project page served at /mishkat gets the right base path without anyone
# editing a constant.
name: Deploy site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - id: pages
        uses: actions/configure-pages@v5

      - run: npm ci

      - run: npm run typecheck
      - run: npm run lint

      # The tafsir library is this site's own copy of tafsir.app's. Read it back
      # and check it against its record before publishing: a work that is listed
      # but incomplete would show the reader a passage that is not there.
      - name: Check the tafsir library is whole
        run: npm run mirror:tafsir -- --verify

      # The surah introductions quote from that library. Find every quotation
      # in the copy again, word for word, and check each introduction is whole:
      # one that has drifted from its sources is not published.
      - name: Check the introductions against their sources
        run: npm run check:intros

      - name: Build the static export
        env:
          NEXT_PUBLIC_BASE_PATH: ${{ steps.pages.outputs.base_path }}
          # Where tafsir.app's passages are read from, if anywhere. Unset, the
          # tafsir panel links to tafsir.app instead of showing its text — see
          # src/lib/quran/tafsirApp.ts. Set it under Settings → Variables.
          NEXT_PUBLIC_TAFSIR_APP_BASE: ${{ vars.TAFSIR_APP_BASE }}
          # The address of the relay that holds the Quran Foundation credentials
          # (scripts/qf-relay.mjs). Unset, the corpus is read from the open
          # api.quran.com, as it always has been — see src/lib/quran/api.ts.
          # This is the relay's address and nothing more: the client secret is
          # the relay's own, and must never be a variable of this build.
          NEXT_PUBLIC_QF_RELAY: ${{ vars.QF_RELAY }}
        run: npm run build

      - name: Check the export is complete
        run: |
          test -f out/index.html
          test -f out/surahs/index.html
          test -f out/notes/index.html
          test -f out/settings/index.html
          # 114 surahs in the reader and 114 in the muṣḥaf view, or something
          # has gone wrong with the static params.
          test "$(find out/read -mindepth 1 -maxdepth 1 -type d -regex '.*/[0-9]+' | wc -l)" -eq 114
          test "$(find out/read -name 'index.html' -path '*mushaf*' | wc -l)" -eq 114
          # And an introduction to each.
          test "$(find out/read -name 'index.html' -path '*about*' | wc -l)" -eq 114
          echo "published site: $(du -sh out | cut -f1)"

      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
