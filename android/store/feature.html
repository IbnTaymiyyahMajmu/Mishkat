<!doctype html>
<!-- Google Play's feature graphic, 1024×500: the lamp alight on the night
     sky, as the app opens in the evening, and the name. Rendered to
     feature.png by a headless browser (android/README.md). -->
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Cormorant+Garamond:ital,wght@0,500;1,400&display=block"
      rel="stylesheet"
    />
    <style>
      html,
      body {
        margin: 0;
        width: 1024px;
        height: 500px;
        overflow: hidden;
      }
      body {
        background:
          radial-gradient(circle at 300px 250px, rgba(222, 180, 110, 0.16) 0, rgba(222, 180, 110, 0) 260px),
          radial-gradient(130% 120% at 30% 50%, #2b261e 0%, #161619 48%, #0d0f14 100%);
        display: flex;
        align-items: center;
        color: #efece4;
      }
      svg {
        width: 300px;
        height: 300px;
        margin-left: 150px;
        flex: none;
      }
      .words {
        margin-left: 40px;
      }
      .arabic {
        font-family: "Amiri", serif;
        font-size: 64px;
        line-height: 1.2;
        color: #deb46e;
        text-align: left;
        margin-bottom: 22px;
      }
      .name {
        font-family: "Cormorant Garamond", serif;
        font-weight: 500;
        font-size: 92px;
        line-height: 1;
        letter-spacing: -0.01em;
      }
      .line {
        margin-top: 18px;
        font-family: "Cormorant Garamond", serif;
        font-style: italic;
        font-size: 30px;
        color: #d9b678;
      }
    </style>
  </head>
  <body>
    <svg viewBox="5 5 22 25" aria-hidden="true">
      <defs>
        <radialGradient id="flame" cx="16" cy="15.5" r="3" gradientUnits="userSpaceOnUse">
          <stop offset="0" stop-color="#FFF6DC" />
          <stop offset="0.45" stop-color="#F3D08A" stop-opacity="0.7" />
          <stop offset="1" stop-color="#F3D08A" stop-opacity="0" />
        </radialGradient>
      </defs>
      <g fill="none" stroke="#DEB46E">
        <circle cx="16" cy="15.5" r="3" fill="url(#flame)" stroke="none" />
        <path d="M9 27V15a7 7 0 0 1 14 0v12" stroke-width="1.2" />
        <circle cx="16" cy="15.5" r="3.4" stroke-width="1.1" />
        <path d="M16 12.1V9.4" stroke-width="1.1" stroke-linecap="round" />
        <path d="M9 27h14" stroke-width="1.2" stroke-linecap="round" />
      </g>
    </svg>
    <div class="words">
      <div class="arabic" lang="ar" dir="rtl">مِشْكَاة</div>
      <div class="name">Mishkāt</div>
      <div class="line">Read the Qur'an, word by word, by lamplight</div>
    </div>
  </body>
</html>
